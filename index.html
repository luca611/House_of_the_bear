<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Site</title>
    <script src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topBar">
        <div class="logo">
            <img src="resources/imgs/logo.webp" alt="logo" class="logoImage">
            <h1 class="logoText"> house of the bear</h1>
        </div>
        <div class="links">
            <button class="navButton">
                find us
            </button>
            <button class="navButton">
                events
            </button>
            <button class="navButton">
                menu
            </button>
            <button class="navButton highlighted">
                book
            </button>
        </div>
    </div>

    <div class="main">
        <div class="landingSection light">
            <div class="innerDarker">
                
                <h1 class="mainTitle">House of the Bear</h1>
                <h2 class="subTitle">Savor the Flavors of the Wild.</h2>
                <div class="quicks">
                    <button class="quick"><img src="resources/icons/facebook.svg" alt="facebook"></button>
                    <button class="quick"><img src="resources/icons/instagram.svg" alt="instagram"></button>
                    <button class="quick"><img src="resources/icons/tripadvisor.svg" alt="tripadvisor"></button>
                </div>
            </div>
            <img src="resources/imgs/tree.png" alt="tree" class="tree dx tall">
            <img src="resources/imgs/tree.png" alt="tree" class="tree sx tall">
            <img src="resources/imgs/tree.png" alt="tree" class="tree dx short">
            <img src="resources/imgs/tree.png" alt="tree" class="tree sx short">
            <img src="resources/imgs/bush.png" alt="bush" class="bush dx">
            <img src="resources/imgs/bush.png" alt="bush" class="bush sx">

            <img src="resources/imgs/peakingBear.png" alt="bear" class="bear">
            <div class="separation dark"></div>
        </div>
        <div class="section dark">
            <div class="separation light"></div>
        </div>
        <div class="section light">
        </div>
    </div>
</body>
</html>
